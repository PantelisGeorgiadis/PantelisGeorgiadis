name: Git Bonsai
on:
  schedule:
    - cron: "00 3 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]
permissions:
  contents: write
concurrency: bonsai
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: appnice/git-bonsai@v0
